<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام ریتریت ذهن‌آگاهی | محدثه علی‌مرادی اطاقور</title>
    <style>
        :root {
            --primary: #0f766e;
            --primary-light: #14b8a6;
            --light: #f0fdfa;
        }
        
        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f0fdfa 0%, #ccfbf1 100%);
            color: #333;
            line-height: 1.7;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            box-shadow: 0 15px 35px rgba(15, 118, 110, 0.15);
            border-radius: 20px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 35px 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.6em;
        }

        .content {
            padding: 35px 40px 45px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary);
            font-weight: 500;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1.5px solid #99f6e4;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-light);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .radio-group {
            margin-bottom: 20px;
        }

        .radio-group label {
            display: inline-block;
            margin-left: 20px;
            font-weight: normal;
            cursor: pointer;
        }

        .btn-submit {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: var(--primary-light);
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .success-box {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .success-box h2 {
            color: var(--primary);
            margin-bottom: 15px;
        }

        .success-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .error-msg {
            color: #dc2626;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🌿 فرم ثبت‌نام ریتریت ذهن‌آگاهی</h1>
    </div>

    <div class="content">
        <a href="retreat.html" class="back-link">← بازگشت به توضیحات دوره</a>

        <div id="form-section">
            <form id="retreatForm">
                <input type="hidden" name="_subject" value="ثبت‌نام جدید - ریتریت ذهن‌آگاهی">
                
                <label for="fullname">نام و نام خانوادگی *</label>
                <input type="text" id="fullname" name="نام و نام خانوادگی" required placeholder="نام کامل خود را وارد کنید">

                <label for="mobile">شماره موبایل *</label>
                <input type="tel" id="mobile" name="شماره موبایل" required placeholder="۰۹۱۲xxxxxxx">

                <label for="job">شغل / رشته</label>
                <input type="text" id="job" name="شغل / رشته" placeholder="شغل یا رشته تحصیلی">

                <label>تجربه قبلی مدیتیشن:</label>
                <div class="radio-group">
                    <label><input type="radio" name="تجربه مدیتیشن" value="بله" required> بله</label>
                    <label><input type="radio" name="تجربه مدیتیشن" value="خیر"> خیر</label>
                </div>

                <label for="goal">هدف یا انتظار شما از شرکت در ریتریت</label>
                <textarea id="goal" name="هدف و انتظار" placeholder="لطفاً انتظارات و اهداف خود را بنویسید..."></textarea>

                <button type="submit" class="btn-submit" id="submitBtn">ثبت درخواست</button>
                <p class="error-msg" id="errorMsg">خطایی رخ داد. لطفاً دوباره تلاش کنید.</p>
            </form>
        </div>

        <div id="success-section" class="success-box">
            <div class="success-icon">✅</div>
            <h2>درخواست شما با موفقیت ثبت شد</h2>
            <p>
                از اینکه در ریتریت ذهن‌آگاهی ثبت‌نام کردید متشکریم.<br>
                به زودی از طریق شماره موبایلی که وارد کردید با شما تماس گرفته می‌شود.
            </p>
            <br>
            <a href="index.html" class="back-link">بازگشت به صفحه اصلی</a>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('retreatForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'در حال ارسال...';
        errorMsg.style.display = 'none';

        try {
            const response = await fetch('https://formspree.io/f/xvkpkpje', {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            });

            if (response.ok) {
                document.getElementById('form-section').style.display = 'none';
                document.getElementById('success-section').style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                throw new Error('خطا در ارسال');
            }
        } catch (error) {
            errorMsg.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'ثبت درخواست';
        }
    });
</script>

</body>
</html>
